spring.application.name=field-work-orders

spring.datasource.url=jdbc:postgresql://localhost:5433/field_work_orders
spring.datasource.username=fieldwork
spring.datasource.password=fieldwork

# Demo only: schema is created/updated by Hibernate. Not a migration strategy.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Demo-only secret; replace before any real deployment.
app.jwt.secret=field-work-orders-demo-jwt-secret-change-me-32b
app.jwt.expiration-ms=86400000
app.uploads.dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
